<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}TraceGuard{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body><header class="topbar"><a class="brand" href="{{url_for('audit')}}"><span class="brandmark">T</span><span><b>TraceGuard</b><small>Digital Footprint Audit</small></span></a><nav><a class="{{'active' if request.endpoint=='audit'}}" href="{{url_for('audit')}}">Audit</a><a class="{{'active' if request.endpoint=='records'}}" href="{{url_for('records')}}">Records</a></nav></header>
{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}<footer>TraceGuard • Student Digital Safety Tool</footer><script src="{{url_for('static',filename='app.js')}}"></script></body></html>
